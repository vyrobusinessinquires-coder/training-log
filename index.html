<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAIN LOG">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Private, offline workout tracker.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>TRAIN LOG</title>
  <style>
    :root {
      --black: #000000;
      --surface: #121212;
      --line: #262626;
      --white: #FFFFFF;
      --muted: #8E8E93;
      --orange: #FF5500;
      --nav-h: 66px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      color-scheme: dark;
      font-variant-numeric: tabular-nums;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--black); color: var(--white); }
    body { overflow: hidden; }
    button, input, select { font: inherit; font-variant-numeric: tabular-nums; }
    button { min-height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--white); border-radius: 0; padding: 0 14px; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { min-height: 48px; min-width: 0; color: var(--white); background: #080808; border: 1px solid var(--line); border-radius: 0; padding: 0 10px; }
    input[type="checkbox"] { width: 48px; height: 48px; min-height: 48px; accent-color: var(--orange); }
    .app { width: 100%; height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--black); }
    .topbar { min-height: 70px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--black); z-index: 5; }
    .brand { min-width: 0; }
    .eyebrow { color: var(--muted); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .workout-name { font-size: 16px; font-weight: 650; line-height: 1.25; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70vw; }
    .elapsed { text-align: right; min-width: 72px; }
    .elapsed strong { display: block; font-size: 17px; font-weight: 650; }
    .elapsed span { font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
    main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #333 transparent; padding-bottom: 12px; }
    .screen { display: none; min-height: 100%; }
    .screen.active { display: block; }
    .screen-head { padding: 20px 16px 14px; border-bottom: 1px solid var(--line); }
    .screen-head h1 { font-size: 22px; line-height: 1.15; font-weight: 680; margin: 0; letter-spacing: -.035em; }
    .screen-head p { color: var(--muted); margin: 7px 0 0; font-size: 13px; line-height: 1.45; }
    .section-label { padding: 17px 16px 8px; color: var(--muted); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .row { background: var(--surface); border-top: 1px solid var(--line); padding: 13px 16px; }
    .row:last-child { border-bottom: 1px solid var(--line); }
    .row-title { font-size: 15px; font-weight: 620; line-height: 1.3; }
    .row-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .phase-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 16px 9px; border-top: 1px solid var(--line); }
    .phase-title h2 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
    .phase-title span { font-size: 11px; color: var(--muted); }
    .exercise { background: var(--surface); border-top: 1px solid var(--line); padding: 13px 12px 14px; }
    .exercise:last-child { border-bottom: 1px solid var(--line); }
    .exercise-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 0 4px 10px; }
    .exercise-name { font-size: 14px; line-height: 1.3; font-weight: 630; }
    .exercise-detail { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .rest-control { display: flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .rest-control button { width: 34px; min-width: 34px; min-height: 48px; height: 48px; padding: 0; font-size: 18px; }
    .set-head, .set-line { display: grid; grid-template-columns: 38px minmax(72px, 1fr) minmax(72px, 1fr) 54px; gap: 7px; align-items: center; }
    .set-head { padding: 0 4px 6px; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
    .set-line { padding: 4px; min-height: 56px; border-top: 1px solid #202020; }
    .set-number { color: var(--muted); font-size: 12px; text-align: center; }
    .field-stepper { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; gap: 3px; min-width: 0; }
    .field-stepper button { min-height: 48px; height: 48px; width: 30px; min-width: 30px; padding: 0; font-size: 17px; }
    .field-stepper input { width: 100%; min-width: 0; min-height: 48px; height: 48px; padding: 0 3px; text-align: center; font-size: 13px; }
    .field-stepper input:disabled { opacity: .6; }
    .done-cell { display: flex; align-items: center; justify-content: center; min-height: 48px; }
    .done-cell input { width: 48px; height: 48px; min-height: 48px; margin: 0; }
    .coach-note { border: 1px solid #383028; margin: 10px 12px 12px; padding: 11px 12px; color: #d5c6ba; font-size: 12px; line-height: 1.45; background: #100d0a; }
    .inline-note { color: var(--muted); font-size: 12px; padding: 12px 16px; line-height: 1.5; }
    .action-dock { border-top: 1px solid var(--line); padding: 9px 14px calc(9px + var(--safe-bottom)); background: var(--black); }
    .primary { width: 100%; min-height: 52px; border: 1px solid var(--orange); background: var(--orange); color: #000; font-weight: 750; font-size: 14px; letter-spacing: .01em; }
    .primary:active { background: #e94d00; }
    .secondary { background: transparent; border: 1px solid var(--line); color: var(--white); }
    .tabbar { min-height: calc(var(--nav-h) + var(--safe-bottom)); padding: 5px 5px calc(5px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--black); z-index: 8; }
    .tab { border: 0; background: transparent; min-height: 52px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 10px; }
    .tab .tab-icon { font-size: 17px; line-height: 1; }
    .tab.active { color: var(--orange); }
    .rest-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--orange); padding: 8px 12px; min-height: 63px; background: #120b07; }
    .rest-bar.visible { display: flex; }
    .rest-left { min-width: 0; }
    .rest-label { color: #d7a58d; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .rest-time { color: var(--white); font-size: 22px; font-weight: 700; margin-top: 2px; }
    .rest-actions { display: flex; gap: 6px; }
    .rest-actions button { min-height: 48px; height: 48px; padding: 0 11px; font-size: 12px; }
    .rest-actions .skip { border-color: var(--orange); color: var(--orange); }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .list-row .left { min-width: 0; }
    .list-row .right { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .routine-day { border-bottom: 1px solid var(--line); padding: 14px 16px; background: var(--surface); }
    .routine-day strong { font-size: 14px; }
    .routine-day p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .routine-day button { margin-top: 10px; min-height: 48px; }
    .history-empty { padding: 28px 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .history-summary { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 9px; color: var(--muted); font-size: 11px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .setting-row .copy { min-width: 0; }
    .setting-row label, .setting-row .setting-name { display: block; font-size: 14px; font-weight: 600; }
    .setting-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .setting-row select { width: 110px; }
    .setting-row input[type="checkbox"] { width: 48px; height: 48px; min-height: 48px; }
    .backup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
    .backup-actions button { min-height: 50px; font-size: 12px; }
    .food-item { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: start; }
    .food-item input { margin-top: 2px; }
    .food-time { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .food-text { font-size: 13px; line-height: 1.45; margin-top: 3px; }
    .week-actions { display: flex; gap: 8px; padding: 12px 16px; }
    .week-actions button { flex: 1; }
    .small-button { min-height: 48px; font-size: 11px; }
    .muted { color: var(--muted); }
    .accent { color: var(--orange); }
    .hidden { display: none !important; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px); z-index: 30; padding: 12px 14px; background: #1b1b1b; border: 1px solid var(--line); color: var(--white); font-size: 12px; display: none; }
    .toast.show { display: block; }
    @media (min-width: 720px) {
      .app { max-width: 620px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
      body { background: #000000; }
      .workout-name { max-width: 450px; }
      .set-head, .set-line { grid-template-columns: 44px minmax(90px, 1fr) minmax(90px, 1fr) 60px; }
    }
    @media (max-width: 360px) {
      .set-head, .set-line { grid-template-columns: 30px minmax(66px, 1fr) minmax(66px, 1fr) 50px; gap: 4px; }
      .field-stepper { grid-template-columns: 26px minmax(0, 1fr) 26px; gap: 2px; }
      .field-stepper button { width: 26px; min-width: 26px; min-height: 48px; height: 48px; }
      .rest-control { gap: 3px; font-size: 10px; }
      .rest-control button { width: 30px; min-width: 30px; min-height: 48px; height: 48px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">TRAIN LOG / PRIVATE</div>
      <div class="workout-name" id="header-workout">Loading routine…</div>
    </div>
    <div class="elapsed"><strong id="elapsed-time">00:00</strong><span>Elapsed</span></div>
  </header>

  <main id="main-scroll">
    <section class="screen active" id="screen-today" aria-label="Today">
      <div id="today-content"></div>
    </section>
    <section class="screen" id="screen-routines" aria-label="Routines">
      <div class="screen-head"><h1>Routines</h1><p>Your seven-day training rotation.</p></div>
      <div id="routines-content"></div>
    </section>
    <section class="screen" id="screen-history" aria-label="History">
      <div class="screen-head"><h1>History</h1><p>Completed sessions saved on this device.</p></div>
      <div id="history-content"></div>
    </section>
    <section class="screen" id="screen-settings" aria-label="Settings">
      <div class="screen-head"><h1>Settings</h1><p>Local preferences and your data backup.</p></div>
      <div id="settings-content"></div>
    </section>
  </main>

  <div class="rest-bar" id="rest-bar" aria-live="polite">
    <div class="rest-left"><div class="rest-label">Rest timer</div><div class="rest-time" id="rest-time">01:30</div></div>
    <div class="rest-actions"><button id="rest-add">+15s</button><button class="skip" id="rest-skip">Skip</button></div>
  </div>
  <div class="action-dock" id="action-dock"></div>
  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="today"><span class="tab-icon">◉</span><span>Today</span></button>
    <button class="tab" data-tab="routines"><span class="tab-icon">▤</span><span>Routines</span></button>
    <button class="tab" data-tab="history"><span class="tab-icon">↺</span><span>History</span></button>
    <button class="tab" data-tab="settings"><span class="tab-icon">⚙</span><span>Settings</span></button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <input id="import-file" type="file" accept="application/json,.json" class="hidden">
</div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'train-log-data-v1';
  const DAY_NAMES = ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'];
  const ROUTINES = [
    {

          ex('Bodyweight squats', 1, 10, 'reps', { weighted: false, rest: 30 }),

    {

    else if (action === 'import') document.getElementById('import-file').click();
    else if (action === 'select-day') {
      if (data.active) { showToast('Finish the active workout before changing the rotation.'); return; }
      data.rotationDay = Number(button.dataset.day); save(); renderAll(); showToast(`Today set to ${DAY_NAMES[data.rotationDay-1]}.`);
    }
    else if (action === 'history-detail') {
      const h = data.history.find(x => x.id === button.dataset.id);
      const target = document.getElementById(`history-detail-${button.dataset.id}`);
      if (!h || !target) return;
      if (!target.classList.contains('hidden')) { target.classList.add('hidden'); button.textContent = 'View session'; return; }
      let details = '';
      const routine = routineForDay(h.day);
      routine.phases.forEach((phase, pi) => {
        phase.exercises.forEach((exercise, ei) => {
          const state = h.exercises?.[`${pi}-${ei}`];
          if (!state) return;
          const checked = state.sets.filter(s => s.done).length;
          const best = [...state.sets].reverse().find(s => s.done);
          details += `<div class="row-sub" style="padding:8px 0;border-top:1px solid #262626"><strong style="color:#fff">${escapeHtml(exercise.name)}</strong> · ${checked}/${state.sets.length} sets${best && exercise.weighted ? ` · last logged ${best.weight} kg × ${best.reps}` : ''}</div>`;
        });
      });
      target.innerHTML = details || '<div class="row-sub">No set details recorded.</div>';
      target.classList.remove('hidden'); button.textContent = 'Hide details';
    }
    else if (action === 'rest-complete') {
      data.rotationDay = 1; save(); renderAll(); showToast('Rest day complete. Day 1 is next.');
    }
  });
  document.addEventListener('change', (event) => {
    const el = event.target;
    if (el.matches('[data-action="done"]')) toggleSet(el.dataset.exercise, Number(el.dataset.set), el.checked);
    else if (el.matches('[data-action="fuel"]')) {
      const key = localDateKey();
      if (!data.fuelChecks[key]) data.fuelChecks[key] = [false, false, false, false, false];
      data.fuelChecks[key][Number(el.dataset.index)] = el.checked; save();
    }
    else if (el.matches('[data-field]')) setValue(el.dataset.exercise, Number(el.dataset.set), el.dataset.field, el.value);
    else if (el.id === 'default-rest') { data.settings.defaultRest = Number(el.value); save(); showToast('Default rest updated.'); }
    else if (el.id === 'chime-toggle') { data.settings.chime = el.checked; save(); }
  });
  document.getElementById('rest-add').addEventListener('click', addRest);
  document.getElementById('rest-skip').addEventListener('click', skipRest);
  document.getElementById('import-file').addEventListener('change', (event) => {
    const file = event.target.files?.[0]; if (file) importData(file); event.target.value = '';
  });
  // Update the two timers without re-rendering the workout or stealing focus from inputs.
  uiTimer = setInterval(() => {
    updateHeader();
    if (data.active?.rest) updateRestBar();
  }, 250);
  if (data.active?.rest && data.active.rest.endAt <= Date.now()) lastRestEndHandled = null;
  renderAll();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed:', err)));
  }
})();
</script>
</body>
