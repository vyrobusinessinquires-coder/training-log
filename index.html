<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TRAIN LOG">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Private, offline workout tracker.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>TRAIN LOG</title>
  <style>
    :root {
      --black: #000000;
      --surface: #121212;
      --line: #262626;
      --white: #FFFFFF;
      --muted: #8E8E93;
      --orange: #FF5500;
      --nav-h: 66px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      color-scheme: dark;
      font-variant-numeric: tabular-nums;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; background: var(--black); color: var(--white); }
    body { overflow: hidden; }
    button, input, select { font: inherit; font-variant-numeric: tabular-nums; }
    button { min-height: 48px; border: 1px solid var(--line); background: var(--surface); color: var(--white); border-radius: 0; padding: 0 14px; cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { min-height: 48px; min-width: 0; color: var(--white); background: #080808; border: 1px solid var(--line); border-radius: 0; padding: 0 10px; }
    input[type="checkbox"] { width: 48px; height: 48px; min-height: 48px; accent-color: var(--orange); }
    .app { width: 100%; height: 100dvh; max-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--black); }
    .topbar { min-height: 70px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--black); z-index: 5; }
    .brand { min-width: 0; }
    .eyebrow { color: var(--muted); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .workout-name { font-size: 16px; font-weight: 650; line-height: 1.25; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70vw; }
    .elapsed { text-align: right; min-width: 72px; }
    .elapsed strong { display: block; font-size: 17px; font-weight: 650; }
    .elapsed span { font-size: 10px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
    main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: #333 transparent; padding-bottom: 12px; }
    .screen { display: none; min-height: 100%; }
    .screen.active { display: block; }
    .screen-head { padding: 20px 16px 14px; border-bottom: 1px solid var(--line); }
    .screen-head h1 { font-size: 22px; line-height: 1.15; font-weight: 680; margin: 0; letter-spacing: -.035em; }
    .screen-head p { color: var(--muted); margin: 7px 0 0; font-size: 13px; line-height: 1.45; }
    .section-label { padding: 17px 16px 8px; color: var(--muted); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .row { background: var(--surface); border-top: 1px solid var(--line); padding: 13px 16px; }
    .row:last-child { border-bottom: 1px solid var(--line); }
    .row-title { font-size: 15px; font-weight: 620; line-height: 1.3; }
    .row-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
    .phase-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 16px 9px; border-top: 1px solid var(--line); }
    .phase-title h2 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
    .phase-title span { font-size: 11px; color: var(--muted); }
    .exercise { background: var(--surface); border-top: 1px solid var(--line); padding: 13px 12px 14px; }
    .exercise:last-child { border-bottom: 1px solid var(--line); }
    .exercise-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 0 4px 10px; }
    .exercise-name { font-size: 14px; line-height: 1.3; font-weight: 630; }
    .exercise-detail { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    .rest-control { display: flex; align-items: center; gap: 5px; white-space: nowrap; color: var(--muted); font-size: 11px; }
    .rest-control button { width: 34px; min-width: 34px; min-height: 48px; height: 48px; padding: 0; font-size: 18px; }
    .set-head, .set-line { display: grid; grid-template-columns: 38px minmax(72px, 1fr) minmax(72px, 1fr) 54px; gap: 7px; align-items: center; }
    .set-head { padding: 0 4px 6px; font-size: 9px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
    .set-line { padding: 4px; min-height: 56px; border-top: 1px solid #202020; }
    .set-number { color: var(--muted); font-size: 12px; text-align: center; }
    .field-stepper { display: grid; grid-template-columns: 30px minmax(0, 1fr) 30px; gap: 3px; min-width: 0; }
    .field-stepper button { min-height: 48px; height: 48px; width: 30px; min-width: 30px; padding: 0; font-size: 17px; }
    .field-stepper input { width: 100%; min-width: 0; min-height: 48px; height: 48px; padding: 0 3px; text-align: center; font-size: 13px; }
    .field-stepper input:disabled { opacity: .6; }
    .done-cell { display: flex; align-items: center; justify-content: center; min-height: 48px; }
    .done-cell input { width: 48px; height: 48px; min-height: 48px; margin: 0; }
    .coach-note { border: 1px solid #383028; margin: 10px 12px 12px; padding: 11px 12px; color: #d5c6ba; font-size: 12px; line-height: 1.45; background: #100d0a; }
    .inline-note { color: var(--muted); font-size: 12px; padding: 12px 16px; line-height: 1.5; }
    .action-dock { border-top: 1px solid var(--line); padding: 9px 14px calc(9px + var(--safe-bottom)); background: var(--black); }
    .primary { width: 100%; min-height: 52px; border: 1px solid var(--orange); background: var(--orange); color: #000; font-weight: 750; font-size: 14px; letter-spacing: .01em; }
    .primary:active { background: #e94d00; }
    .secondary { background: transparent; border: 1px solid var(--line); color: var(--white); }
    .tabbar { min-height: calc(var(--nav-h) + var(--safe-bottom)); padding: 5px 5px calc(5px + var(--safe-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--black); z-index: 8; }
    .tab { border: 0; background: transparent; min-height: 52px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 10px; }
    .tab .tab-icon { font-size: 17px; line-height: 1; }
    .tab.active { color: var(--orange); }
    .rest-bar { display: none; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--orange); padding: 8px 12px; min-height: 63px; background: #120b07; }
    .rest-bar.visible { display: flex; }
    .rest-left { min-width: 0; }
    .rest-label { color: #d7a58d; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .rest-time { color: var(--white); font-size: 22px; font-weight: 700; margin-top: 2px; }
    .rest-actions { display: flex; gap: 6px; }
    .rest-actions button { min-height: 48px; height: 48px; padding: 0 11px; font-size: 12px; }
    .rest-actions .skip { border-color: var(--orange); color: var(--orange); }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .list-row .left { min-width: 0; }
    .list-row .right { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .routine-day { border-bottom: 1px solid var(--line); padding: 14px 16px; background: var(--surface); }
    .routine-day strong { font-size: 14px; }
    .routine-day p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .routine-day button { margin-top: 10px; min-height: 48px; }
    .history-empty { padding: 28px 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .history-summary { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 9px; color: var(--muted); font-size: 11px; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .setting-row .copy { min-width: 0; }
    .setting-row label, .setting-row .setting-name { display: block; font-size: 14px; font-weight: 600; }
    .setting-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .setting-row select { width: 110px; }
    .setting-row input[type="checkbox"] { width: 48px; height: 48px; min-height: 48px; }
    .backup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 16px; }
    .backup-actions button { min-height: 50px; font-size: 12px; }
    .food-item { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: start; }
    .food-item input { margin-top: 2px; }
    .food-time { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    .food-text { font-size: 13px; line-height: 1.45; margin-top: 3px; }
    .week-actions { display: flex; gap: 8px; padding: 12px 16px; }
    .week-actions button { flex: 1; }
    .small-button { min-height: 48px; font-size: 11px; }
    .muted { color: var(--muted); }
    .accent { color: var(--orange); }
    .hidden { display: none !important; }
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + var(--safe-bottom) + 14px); z-index: 30; padding: 12px 14px; background: #1b1b1b; border: 1px solid var(--line); color: var(--white); font-size: 12px; display: none; }
    .toast.show { display: block; }
    @media (min-width: 720px) {
      .app { max-width: 620px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
      body { background: #000000; }
      .workout-name { max-width: 450px; }
      .set-head, .set-line { grid-template-columns: 44px minmax(90px, 1fr) minmax(90px, 1fr) 60px; }
    }
    @media (max-width: 360px) {
      .set-head, .set-line { grid-template-columns: 30px minmax(66px, 1fr) minmax(66px, 1fr) 50px; gap: 4px; }
      .field-stepper { grid-template-columns: 26px minmax(0, 1fr) 26px; gap: 2px; }
      .field-stepper button { width: 26px; min-width: 26px; min-height: 48px; height: 48px; }
      .rest-control { gap: 3px; font-size: 10px; }
      .rest-control button { width: 30px; min-width: 30px; min-height: 48px; height: 48px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">TRAIN LOG / PRIVATE</div>
      <div class="workout-name" id="header-workout">Loading routine…</div>
    </div>
    <div class="elapsed"><strong id="elapsed-time">00:00</strong><span>Elapsed</span></div>
  </header>

  <main id="main-scroll">
    <section class="screen active" id="screen-today" aria-label="Today">
      <div id="today-content"></div>
    </section>
    <section class="screen" id="screen-routines" aria-label="Routines">
      <div class="screen-head"><h1>Routines</h1><p>Your seven-day training rotation.</p></div>
      <div id="routines-content"></div>
    </section>
    <section class="screen" id="screen-history" aria-label="History">
      <div class="screen-head"><h1>History</h1><p>Completed sessions saved on this device.</p></div>
      <div id="history-content"></div>
    </section>
    <section class="screen" id="screen-settings" aria-label="Settings">
      <div class="screen-head"><h1>Settings</h1><p>Local preferences and your data backup.</p></div>
      <div id="settings-content"></div>
    </section>
  </main>

  <div class="rest-bar" id="rest-bar" aria-live="polite">
    <div class="rest-left"><div class="rest-label">Rest timer</div><div class="rest-time" id="rest-time">01:30</div></div>
    <div class="rest-actions"><button id="rest-add">+15s</button><button class="skip" id="rest-skip">Skip</button></div>
  </div>
  <div class="action-dock" id="action-dock"></div>
  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-tab="today"><span class="tab-icon">◉</span><span>Today</span></button>
    <button class="tab" data-tab="routines"><span class="tab-icon">▤</span><span>Routines</span></button>
    <button class="tab" data-tab="history"><span class="tab-icon">↺</span><span>History</span></button>
    <button class="tab" data-tab="settings"><span class="tab-icon">⚙</span><span>Settings</span></button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <input id="import-file" type="file" accept="application/json,.json" class="hidden">
</div>
<script>
(() => {
  'use strict';
  const STORAGE_KEY = 'train-log-data-v1';
  const DAY_NAMES = ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5', 'Day 6', 'Day 7'];

  function makeDay(id, title, location, phases, restDay=false) {
    return { id, title, location, phases, restDay };
  }
  const STAGE_ROUTINES = {
    1: [
      makeDay(1,'Legs & Bounce','Anytime Fitness',[
        {name:'Warm-up',note:'Easy joint preparation',exercises:[ex('Ankle circles',1,10,'reps',{detail:'Each direction / side',weighted:false,rest:15}),ex('Leg swings',1,10,'reps',{detail:'Front and side · each leg',weighted:false,rest:15}),ex('Bodyweight squats',1,10,'reps',{weighted:false,rest:30})]},
        {name:'Explosive primer',note:'Light effort; quiet, balanced landings',exercises:[ex('Ankle pogo hops',3,10,'reps',{weighted:false,rest:45}),ex('Squat jumps',3,4,'reps',{detail:'Only if landing mechanics are comfortable; otherwise practice controlled squats',weighted:false,rest:75})]},
        {name:'Strength',note:'Technique first; use manageable resistance with supervision',exercises:[ex('Goblet squat / light barbell squat',4,6,'reps',{range:'6–8 reps',weighted:true,rest:90}),ex('Dumbbell Romanian deadlift',3,8,'reps',{weighted:true,rest:90}),ex('Leg press',3,10,'reps',{weighted:true,rest:90})]},
        {name:'Stretching · last',note:'Comfortable range only',exercises:[ex('Assisted ATG split squat',2,6,'reps',{detail:'Each leg · hold rack for balance',weighted:false,rest:30}),ex('Couch stretch',1,30,'seconds',{detail:'Each side',weighted:false,rest:15})]}
      ]),
      makeDay(2,'Speed, Grass Basics & Mobility','Camp Aguinaldo',[
        {name:'Warm-up',note:'Build up gradually',exercises:[ex('Light jog',1,3,'minutes',{weighted:false,rest:15}),ex('High knees',1,10,'reps',{weighted:false,rest:15}),ex('Butt kicks',1,10,'reps',{weighted:false,rest:15}),ex('Walking lunges',1,10,'reps',{detail:'Total steps',weighted:false,rest:30})]},
        {name:'Speed',note:'Controlled strides, not all-out sprints',exercises:[ex('40 m strides',4,40,'meters',{detail:'About 75% effort · rest 2 min',weighted:false,rest:120})]},
        {name:'Grass basics',note:'Use a clear, suitable surface; rolling skills only with a qualified coach',exercises:[ex('High plank hold',3,30,'seconds',{weighted:false,rest:45}),ex('Forward / backward somersault roll practice',1,1,'coach-led',{detail:'Coach-supervised on suitable mats; do not attempt unsupervised',weighted:false,rest:0,noSets:true})]},
        {name:'Stretching · last',note:'Gentle mobility',exercises:[ex('Half-kneeling hip stretch',1,45,'seconds',{detail:'Each leg',weighted:false,rest:15}),ex('Seated straddle reach',2,30,'seconds',{weighted:false,rest:20})]}
      ]),
      makeDay(3,'Push & Core','Anytime Fitness',[
        {name:'Warm-up',note:'Prepare wrists and shoulders',exercises:[ex('Wrist circles',1,10,'reps',{weighted:false,rest:10}),ex('Arm circles',1,10,'reps',{weighted:false,rest:10}),ex('Wall push-ups',1,10,'reps',{weighted:false,rest:30})]},
        {name:'Explosive primer',note:'Use a high, stable bench; stop if wrists or shoulders hurt',exercises:[ex('Incline plyometric push-ups',3,5,'reps',{weighted:false,rest:60})]},
        {name:'Strength',note:'Controlled reps; leave a few comfortable reps in reserve',exercises:[ex('Barbell / dumbbell bench press',4,6,'reps',{range:'6–8 reps',weighted:true,rest:120}),ex('Seated dumbbell shoulder press',3,8,'reps',{weighted:true,rest:90}),ex('Bench dips',3,8,'reps',{range:'8–10 reps',detail:'Feet on floor; use pain-free range or substitute cable press-down',weighted:false,rest:75})]},
        {name:'Accessories & core',note:'Smooth, controlled movement',exercises:[ex('Dumbbell lateral raises',3,12,'reps',{weighted:true,rest:60}),ex('Hanging knee raises / captain’s chair',3,8,'reps',{weighted:false,rest:60})]},
        {name:'Stretching · last',note:'Gentle stretch',exercises:[ex('Doorway chest stretch',1,30,'seconds',{detail:'Each side',weighted:false,rest:15})]}
      ]),
      makeDay(4,'Pull, Grip & Stamina','Anytime Fitness',[
        {name:'Warm-up',note:'Use comfortable range',exercises:[ex('Supported dead hang',1,15,'seconds',{detail:'Only if comfortable and supervised',weighted:false,rest:20}),ex('Scapular shrugs on bar',1,10,'reps',{weighted:false,rest:30}),ex('Empty-bar hip hinges',1,10,'reps',{weighted:false,rest:30})]},
        {name:'Strength',note:'Light-to-moderate resistance; coach checks technique',exercises:[ex('Trap-bar / light barbell deadlift',3,6,'reps',{weighted:true,rest:120}),ex('Lat pulldown machine',4,8,'reps',{weighted:true,rest:90}),ex('Chest-supported machine row',3,10,'reps',{weighted:true,rest:90})]},
        {name:'Accessories & grip',note:'Stop before grip or form breaks down',exercises:[ex('Dumbbell hammer curls',3,10,'reps',{weighted:true,rest:60}),ex('Bar dead hang',3,20,'seconds',{detail:'Comfortable hold; supervised',weighted:false,rest:60})]},
        {name:'Stamina',note:'Moderate intervals, not all-out',exercises:[ex('Stationary bike intervals',6,20,'seconds',{detail:'20 sec brisk / 40 sec easy',weighted:false,rest:40})]},
        {name:'Stretching · last',note:'Relaxed breathing',exercises:[ex('Child’s pose lat stretch',1,45,'seconds',{weighted:false,rest:15})]}
      ]),
      makeDay(5,'Single-Leg & Spine','Anytime Fitness',[
        {name:'Warm-up',note:'Comfortable mobility',exercises:[ex('Hip 90/90 switches',1,10,'reps',{weighted:false,rest:20}),ex('Bodyweight reverse lunges',1,10,'reps',{weighted:false,rest:30})]},
        {name:'Explosive primer',note:'Low stable step; no jump',exercises:[ex('Fast step-ups',3,5,'reps',{detail:'Each leg · drive knee up, controlled descent',weighted:false,rest:60})]},
        {name:'Strength',note:'Balanced, controlled reps',exercises:[ex('Split squat',3,8,'reps',{detail:'Each leg · back foot stays on floor',weighted:false,rest:75}),ex('Incline dumbbell press',3,8,'reps',{range:'8–10 reps',weighted:true,rest:90})]},
        {name:'Mobility & spine',note:'Unloaded mobility',exercises:[ex('PVC / broomstick shoulder mobility',3,10,'reps',{detail:'Pain-free shoulder range',weighted:false,rest:30}),ex('Glute bridges',3,12,'reps',{weighted:false,rest:45}),ex('Cobra stretch',3,20,'seconds',{weighted:false,rest:20})]}
      ]),
      makeDay(6,'Stamina & Balance','Camp Aguinaldo',[
        {name:'Warm-up',note:'Easy start',exercises:[ex('Brisk walk',1,3,'minutes',{weighted:false,rest:15}),ex('Ankle bounces',1,10,'reps',{weighted:false,rest:15})]},
        {name:'Stamina',note:'Conversational pace',exercises:[ex('Brisk walk / easy jog',1,25,'minutes',{range:'25–30 minutes',weighted:false,rest:0})]},
        {name:'Balance basics',note:'Use a low, stable curb and safe open area',exercises:[ex('Low curb step-ups & balance walks',1,10,'minutes',{weighted:false,rest:0}),ex('Supported deep squat hold',2,30,'seconds',{detail:'Hold a stable support if needed',weighted:false,rest:30})]}
      ]),
      makeDay(7,'Full Rest','Recovery',[],true)
    ],
    2: [
      makeDay(1,'Legs & Bounce','Anytime Fitness',[
        {name:'Explosive primer',note:'Low-impact and coached',exercises:[ex('Pogo hops / small jump practice',3,4,'reps',{detail:'Small, quiet landings',weighted:false,rest:60})]},
        {name:'Strength',note:'Coach-supervised technique; no max attempts',exercises:[ex('Barbell back squat',4,5,'reps',{range:'5–6 reps',weighted:true,rest:150}),ex('Barbell Romanian deadlift',3,8,'reps',{weighted:true,rest:90}),ex('Leg press',3,10,'reps',{weighted:true,rest:90})]},
        {name:'Stretching · last',note:'Comfortable range',exercises:[ex('Bodyweight ATG split squat',2,8,'reps',{detail:'Each leg; use support if needed',weighted:false,rest:30})]}
      ]),
      makeDay(2,'Speed & Acro Basics','Camp Aguinaldo',[
        {name:'Speed',note:'Build gradually; avoid all-out sprinting',exercises:[ex('40 m controlled sprints',5,40,'meters',{detail:'Up to about 85% only if coached and pain-free; rest 2 min',weighted:false,rest:120})]},
        {name:'Acro skill block',note:'Coach-supervised, on suitable mats with spotting; no solo inversion or tumbling attempts',exercises:[ex('Wall handstand preparation',1,1,'coach-led',{weighted:false,rest:0,noSets:true}),ex('Candlestick roll / cartwheel progressions',1,1,'coach-led',{weighted:false,rest:0,noSets:true})]},
        {name:'Mobility · last',note:'Do not force splits',exercises:[ex('Half-split mobility',1,45,'seconds',{detail:'Each side',weighted:false,rest:20}),ex('Wide straddle hold',1,45,'seconds',{weighted:false,rest:20})]}
      ]),
      makeDay(3,'Push & Core','Anytime Fitness',[
        {name:'Explosive primer',note:'Stable surface; controlled landing',exercises:[ex('Floor plyometric push-up preparation',3,5,'reps',{detail:'Use incline variation if needed; no clapping required',weighted:false,rest:60})]},
        {name:'Strength',note:'Leave comfortable reps in reserve',exercises:[ex('Barbell bench press',4,5,'reps',{range:'5–6 reps',weighted:true,rest:150}),ex('Pike push-up',3,6,'reps',{range:'6–8 reps',detail:'Keep feet on floor; no elevated setup needed',weighted:false,rest:90}),ex('Assisted dip machine',3,6,'reps',{range:'6–8 reps',weighted:false,rest:90})]},
        {name:'Accessories & core',note:'Controlled reps and supported holds',exercises:[ex('Dumbbell lateral raises',4,12,'reps',{weighted:true,rest:60}),ex('Tucked L-sit preparation',3,15,'seconds',{detail:'Use feet-assisted support',weighted:false,rest:45}),ex('Hanging knee-to-chest raises',3,10,'reps',{weighted:false,rest:60})]}

      1: ['Foundation Phase','Weeks 1–6','Build movement quality, basic strength and comfortable mobility.'],
      2: ['Intermediate Phase','Weeks 7–14','Progress gradually when the foundation criteria are met.'],
      3: ['Hybrid Development','Month 4+','Advanced skills remain coach-supervised; this is not a requirement to rush toward.']
    }[data.selectedStage || 1];
    const selector = `<div class="section-label">Training stage</div>
      <div class="week-actions">${[1,2,3].map(n=>`<button class="${data.selectedStage===n?'primary':'secondary'}" data-action="select-stage" data-stage="${n}">Stage ${n}</button>`).join('')}</div>
      <div class="row"><div class="row-title">${stageInfo[0]} · ${stageInfo[1]}</div><div class="row-sub">${stageInfo[2]}</div></div>`;
    const criteria = data.selectedStage === 1
      ? `<div class="row"><div class="row-title">Stage 2 readiness check</div><div class="row-sub">Your roadmap lists: two weeks of clean, consistent sets; a comfortable 30-second dead hang; 10 clean floor push-ups; and a comfortable toe-touch or mid-shin reach. These are guideposts, not a deadline. Ask a qualified coach and parent/guardian before progressing.</div></div>`
      : data.selectedStage === 2
      ? `<div class="row"><div class="row-title">Stage 3 readiness check</div><div class="row-sub">Your roadmap lists pull-ups, parallel-bar dips, a wall handstand and a floor bridge. Have a qualified coach assess readiness; do not attempt advanced skills alone.</div></div>`
      : `<div class="row"><div class="row-title">Stage 3 safety note</div><div class="row-sub">Advanced gymnastics, deep shoulder positions, sprinting and parkour need qualified coaching, appropriate equipment and a suitable facility. The app uses supervised skill blocks rather than unsupervised instructions.</div></div>`;
    document.getElementById('routines-content').innerHTML = selector + ROUTINES.map(r => {
      const preview = r.restDay ? 'No training · recovery' : r.phases.map(p => p.name).join(' → ');
      return `<div class="routine-day"><div class="list-row"><strong>${DAY_NAMES[r.id-1]} · ${escapeHtml(r.title)}</strong><span class="right">${r.restDay ? 'REST' : escapeHtml(r.location)}</span></div><p>${escapeHtml(preview)}</p><button class="secondary small-button" data-action="select-day" data-day="${r.id}">${data.rotationDay === r.id ? 'Current day' : 'Set as today'}</button></div>`;
    }).join('') + criteria + `<div class="inline-note">Switching stages changes the program used for new sessions. Existing workout history stays attached to its original stage.</div>`;
  }
  function renderHistory() {
    const el = document.getElementById('history-content');
    if (!data.history.length) { el.innerHTML = `<div class="history-empty">No completed sessions yet. Finish a workout and it will appear here.</div>`; return; }
    el.innerHTML = data.history.map(h => `<div class="row"><div class="list-row"><div class="left"><div class="row-title">STAGE ${h.stage || 1} · ${DAY_NAMES[h.day-1]} · ${escapeHtml(h.title)}</div><div class="row-sub">${displayDate(h.startedAt)}</div></div><div class="right">${formatDuration(h.durationMs)}</div></div><div class="history-summary"><span>${h.completedSets}/${h.totalSets} sets checked</span><span>${new Date(h.endedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div><button class="secondary small-button" style="margin-top:10px" data-action="history-detail" data-id="${escapeHtml(h.id)}">View session</button><div class="history-detail hidden" id="history-detail-${escapeHtml(h.id)}"></div></div>`).join('');
  }
  function renderSettings() {
    document.getElementById('settings-content').innerHTML = `
      <div class="section-label">Workout preferences</div>
      <div class="row"><div class="row-title">Current training stage</div><div class="row-sub">Stage ${data.selectedStage || 1}. Change stages in the Routines tab when readiness criteria are met.</div></div>
      <div class="row setting-row"><div class="copy"><span class="setting-name">Default rest timer</span><small>Used for new exercise timers; adjust each exercise during a workout.</small></div><select id="default-rest"><option value="60">1:00</option><option value="75">1:15</option><option value="90">1:30</option><option value="120">2:00</option><option value="150">2:30</option><option value="180">3:00</option></select></div>
      <div class="row setting-row"><div class="copy"><span class="setting-name">Rest-complete chime</span><small>Short tone when the rest timer reaches zero.</small></div><input id="chime-toggle" type="checkbox" ${data.settings.chime ? 'checked' : ''} aria-label="Enable rest chime"></div>
      <div class="section-label">JSON backup</div>
      <div class="row"><div class="row-title">Your data stays on this device</div><div class="row-sub">Export includes settings, active workout, exercise entries, and workout history. Store the JSON file somewhere safe.</div></div>
      <div class="backup-actions"><button class="secondary" data-action="export">Export Data</button><button class="secondary" data-action="import">Import Data</button></div>
      <div class="inline-note">Import replaces the current app data on this device. Export a backup first if you want to keep the current records. No account or cloud sync is used.</div>
      <div class="section-label">Training notes</div>
      <div class="row"><div class="row-title">Technique before load</div><div class="row-sub">Use manageable resistance, keep a few good reps in reserve, and progress gradually. Get a qualified coach to supervise strength training and any gymnastics or acrobatic skills. Stop for pain, dizziness, or unusual symptoms.</div></div>
      <div class="row"><div class="row-title">Sleep & recovery</div><div class="row-sub">Aim for a consistent sleep routine and enough rest. For teens, 8–10 hours is a commonly recommended range; adjust around school, recovery, and how you feel.</div></div>
      <div class="row"><div class="row-title">Install on your phone</div><div class="row-sub">Open this site in your mobile browser and use “Add to Home Screen” / “Install app”. Installation requires the site to be hosted over HTTPS (or served from localhost).</div></div>
    `;
    document.getElementById('default-rest').value = String(data.settings.defaultRest || 90);
  }
  function renderAll() {
    renderToday(); renderRoutines(); renderHistory(); renderSettings(); updateHeader(); updateRestBar();
    document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === currentTab));
    document.querySelectorAll('.screen').forEach(screen => screen.classList.toggle('active', screen.id === `screen-${currentTab}`));
  }
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
    document.querySelectorAll('.screen').forEach(el => el.classList.toggle('active', el.id === `screen-${tab}`));
    document.getElementById('main-scroll').scrollTop = 0;
    document.getElementById('action-dock').classList.toggle('hidden', tab !== 'today');
    document.getElementById('rest-bar').classList.toggle('hidden', tab !== 'today' && !data.active?.rest);
  }
  function exportData() {
    const payload = { ...data, exportedAt: new Date().toISOString(), app: 'TRAIN LOG', schemaVersion: 1 };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `train-log-backup-${localDateKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    showToast('Backup exported.');
  }
  function importData(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imported = JSON.parse(String(reader.result));
        if (!imported || typeof imported !== 'object' || !Array.isArray(imported.history) || !imported.settings || typeof imported.rotationDay !== 'number') throw new Error('Invalid backup format');
        if (!confirm('Import this backup and replace the data currently on this device?')) return;
        const clean = { ...defaultData(), ...imported, settings: { ...defaultData().settings, ...imported.settings, exerciseRest: { ...(imported.settings.exerciseRest || {}) } } };
        clean.rotationDay = Math.min(7, Math.max(1, Math.floor(clean.rotationDay)));
        data = clean; save(); renderAll(); showToast('Backup imported.');
      } catch (err) { showToast('That file is not a valid TRAIN LOG backup.'); }
    };
    reader.onerror = () => showToast('Could not read that file.');
    reader.readAsText(file);
  }

  document.addEventListener('click', (event) => {
    const tab = event.target.closest('[data-tab]');
    if (tab) { switchTab(tab.dataset.tab); return; }
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    if (action === 'start') startWorkout();
    else if (action === 'finish') {
      const done = Object.values(data.active?.exercises || {}).reduce((n, s) => n + s.sets.filter(x => x.done).length, 0);
      if (confirm(`Save this session? ${done} sets are checked.`)) completeWorkout();
    }
    else if (action === 'step') adjustField(button.dataset.exercise, Number(button.dataset.set), button.dataset.key, Number(button.dataset.delta));
    else if (action === 'rest') adjustRest(button.dataset.exercise, Number(button.dataset.delta));
    else if (action === 'export') exportData();
    else if (action === 'import') document.getElementById('import-file').click();
    else if (action === 'select-stage') {
      if (data.active) { showToast('Finish the active workout before changing stages.'); return; }
      data.selectedStage = Math.min(3, Math.max(1, Number(button.dataset.stage)));
      ROUTINES = STAGE_ROUTINES[data.selectedStage];
      data.rotationDay = 1;
      save(); renderAll(); showToast(`Stage ${data.selectedStage} selected.`);
    }
    else if (action === 'select-day') {
      if (data.active) { showToast('Finish the active workout before changing the rotation.'); return; }
      data.rotationDay = Number(button.dataset.day); save(); renderAll(); showToast(`Today set to ${DAY_NAMES[data.rotationDay-1]}.`);
    }
    else if (action === 'history-detail') {
      const h = data.history.find(x => x.id === button.dataset.id);
      const target = document.getElementById(`history-detail-${button.dataset.id}`);
      if (!h || !target) return;
      if (!target.classList.contains('hidden')) { target.classList.add('hidden'); button.textContent = 'View session'; return; }
      let details = '';
      const routine = routineForDay(h.day, h.stage || 1);
      routine.phases.forEach((phase, pi) => {
        phase.exercises.forEach((exercise, ei) => {
          const state = h.exercises?.[`${pi}-${ei}`];
          if (!state) return;
          const checked = state.sets.filter(s => s.done).length;
          const best = [...state.sets].reverse().find(s => s.done);
          details += `<div class="row-sub" style="padding:8px 0;border-top:1px solid #262626"><strong style="color:#fff">${escapeHtml(exercise.name)}</strong> · ${checked}/${state.sets.length} sets${best && exercise.weighted ? ` · last logged ${best.weight} kg × ${best.reps}` : ''}</div>`;
        });
      });
      target.innerHTML = details || '<div class="row-sub">No set details recorded.</div>';
      target.classList.remove('hidden'); button.textContent = 'Hide details';
    }
    else if (action === 'rest-complete') {
      data.rotationDay = 1; save(); renderAll(); showToast('Rest day complete. Day 1 is next.');
    }
  });
  document.addEventListener('change', (event) => {
    const el = event.target;
    if (el.matches('[data-action="done"]')) toggleSet(el.dataset.exercise, Number(el.dataset.set), el.checked);
    else if (el.matches('[data-action="fuel"]')) {
      const key = localDateKey();
      if (!data.fuelChecks[key]) data.fuelChecks[key] = [false, false, false, false, false];
      data.fuelChecks[key][Number(el.dataset.index)] = el.checked; save();
    }
    else if (el.matches('[data-field]')) setValue(el.dataset.exercise, Number(el.dataset.set), el.dataset.field, el.value);
    else if (el.id === 'default-rest') { data.settings.defaultRest = Number(el.value); save(); showToast('Default rest updated.'); }
    else if (el.id === 'chime-toggle') { data.settings.chime = el.checked; save(); }
  });
  document.getElementById('rest-add').addEventListener('click', addRest);
  document.getElementById('rest-skip').addEventListener('click', skipRest);
  document.getElementById('import-file').addEventListener('change', (event) => {
    const file = event.target.files?.[0]; if (file) importData(file); event.target.value = '';
  });
  // Update the two timers without re-rendering the workout or stealing focus from inputs.
  uiTimer = setInterval(() => {
    updateHeader();
    if (data.active?.rest) updateRestBar();
  }, 250);
  if (data.active?.rest && data.active.rest.endAt <= Date.now()) lastRestEndHandled = null;
  renderAll();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Service worker registration failed:', err)));
  }
})();
</script>
</body>
</html>
